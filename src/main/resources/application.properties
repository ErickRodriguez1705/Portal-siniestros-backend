spring.application.name=siniestros-backend
spring.config.import=optional:file:./application-local.properties
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/siniestros}
spring.datasource.username=${DB_USER:siniestros}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/siniestros}
app.jwt.secret=${JWT_SECRET:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.admin.initial.email=${ADMIN_INITIAL_EMAIL:administrador@portal-siniestros.local}
app.admin.initial.password=${ADMIN_INITIAL_PASSWORD:PortalSiniestros2026!}
app.admin.initial.name=${ADMIN_INITIAL_NAME:Administrador}
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
